<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP CCTV - Request</title>
  <link rel="manifest" href="/otp_cctv/manifest.json">
  <style>
    /* ===== DESAIN PROFESIONAL (SAMA) ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #f0f4f8 0%, #d9e2ec 100%);
      padding: 20px;
    }

    .card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0, 20, 40, 0.15), 0 8px 24px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #0b2a4a 0%, #1a4b6d 100%);
      padding: 28px 32px 20px;
      text-align: center;
      border-bottom: 4px solid #4fc3f7;
    }

    .card-header h1 {
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .card-header .subtitle {
      color: #b0d4f0;
      font-size: 13px;
      font-weight: 400;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .card-body {
      padding: 32px 28px 28px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1e3b5a;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #dce4ec;
      border-radius: 14px;
      font-size: 16px;
      background-color: #f9fbfd;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      color: #1a2b3c;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #1a6b9e;
      box-shadow: 0 0 0 4px rgba(26, 107, 158, 0.12);
      background-color: #ffffff;
    }

    .form-group input[readonly] {
      background-color: #f0f4f8;
      color: #2c3e50;
      cursor: default;
    }

    .form-group input[readonly].loading {
      background-color: #eef3f7;
      color: #6b7f94;
      font-style: italic;
    }

    .form-group input[readonly].error {
      background-color: #fde8e8;
      color: #b33c3c;
      border-color: #f5c6cb;
    }

    .form-group input[readonly].success {
      background-color: #e3f0e8;
      color: #1d6b3e;
      border-color: #b8d9c4;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #1a5a8a 0%, #0e3b5e 100%);
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(10, 55, 94, 0.25);
      letter-spacing: 0.5px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(10, 55, 94, 0.35);
    }

    .btn-primary:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    #result {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      display: none;
      word-break: break-word;
    }

    #result.success {
      display: block;
      background: #e3f0e8;
      color: #1a5c3a;
      border: 1px solid #b8d9c4;
    }

    #result.error {
      display: block;
      background: #fde8e8;
      color: #a13131;
      border: 1px solid #f5c6cb;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .overlay.active {
      display: flex;
    }

    .overlay-box {
      background: white;
      padding: 32px 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
      max-width: 320px;
      width: 90%;
    }

    .overlay-box .spinner {
      border: 4px solid #e6edf4;
      border-top: 4px solid #1a6b9e;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .overlay-box p {
      color: #1a2b3c;
      font-size: 16px;
      font-weight: 500;
      margin: 0;
    }

    .overlay-box .sub {
      color: #5f7a94;
      font-size: 14px;
      font-weight: 400;
      margin-top: 4px;
    }

    .approval-note {
      background: #fef9e6;
      border-left: 4px solid #f5b342;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      color: #7a6200;
      margin: -8px 0 18px 0;
      display: none;
    }

    .approval-note.show {
      display: block;
    }

    .hint {
      font-size: 12px;
      color: #7a8fa0;
      margin-top: 4px;
      font-weight: 400;
    }

    @media (max-width: 600px) {
      .card-header {
        padding: 20px 20px 16px;
      }
      .card-header h1 {
        font-size: 20px;
      }
      .card-body {
        padding: 24px 18px 22px;
      }
      .form-group input,
      .form-group select {
        padding: 12px 14px;
        font-size: 15px;
      }
      .btn-primary {
        padding: 14px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- OVERLAY LOADING -->
  <div class="overlay" id="loadingOverlay">
    <div class="overlay-box">
      <div class="spinner"></div>
      <p id="loadingText">Mencari toko...</p>
      <div class="sub" id="loadingSub">Harap tunggu sebentar</div>
    </div>
  </div>

  <!-- CARD -->
  <div class="card">
    <div class="card-header">
      <h1>🔐 Request OTP CCTV</h1>
      <div class="subtitle">Alfamart Rembang Access Management</div>
    </div>

    <div class="card-body">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="email@perusahaan.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="kodeToko">Kode Toko</label>
        <input 
          type="text" 
          id="kodeToko" 
          placeholder="Contoh: 2A01"
          autocomplete="off"
          maxlength="4"
          enterkeyhint="search"
        >
        <div class="hint">Tekan <kbd>Enter</kbd> untuk mencari nama toko</div>
      </div>

      <div class="form-group">
        <label for="namaToko">Nama Toko</label>
        <input type="text" id="namaToko" readonly placeholder=" ">
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select id="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div id="approvalNote" class="approval-note">
        <span class="note-icon">⏳</span> Permintaan dengan role <strong>Admin</strong> memerlukan persetujuan atasan. OTP akan dikirim setelah disetujui.
      </div>

      <button class="btn-primary" id="submitBtn" onclick="submitRequest()">Request OTP</button>

      <div id="result"></div>
    </div>
  </div>

  <script>
    // ===== KONFIGURASI =====
    const API_URL = 'https://script.google.com/macros/s/AKfycbxVOWR6fi2s-CdSVRmPJnnFOQn3q-_fTfYj8yEVhggjOTrZZUt-s1cxjcJpz_ttO7w/exec';
    const FETCH_TIMEOUT = 8000; // 8 detik
    const MIN_REQUEST_INTERVAL = 1500; // 1.5 detik antar request (untuk menghindari rate limit)

    // ===== CACHE =====
    const cache = new Map(); // key: kode toko, value: { success, namaToko, message }

    // ===== ELEMEN =====
    const kodeInput = document.getElementById('kodeToko');
    const namaInput = document.getElementById('namaToko');
    const emailInput = document.getElementById('email');
    const roleSelect = document.getElementById('role');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const overlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const loadingSub = document.getElementById('loadingSub');
    const approvalNote = document.getElementById('approvalNote');

    let isFetching = false;
    let isSubmitting = false;
    let lastRequestTime = 0;

    // ===== HAPUS EVENT LISTENER LAMA (clone) =====
    const newKodeInput = kodeInput.cloneNode(true);
    kodeInput.parentNode.replaceChild(newKodeInput, kodeInput);
    const kodeInputFinal = newKodeInput;

    // ===== EVENT HANYA ENTER =====
    kodeInputFinal.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        this.blur();
        const kode = this.value.trim();
        if (!kode) {
          namaInput.value = '';
          namaInput.className = '';
          return;
        }
        if (!isFetching) {
          fetchNamaToko(kode);
        }
      }
    });

    // ===== FETCH DENGAN CACHE & THROTTLE =====
    async function fetchNamaToko(kode, retryCount = 0) {
      if (isFetching) return;
      const kodeUpper = kode.toUpperCase().trim();

      // Cek cache
      if (cache.has(kodeUpper)) {
        const cached = cache.get(kodeUpper);
        if (cached.success) {
          namaInput.value = cached.namaToko;
          namaInput.className = 'success';
        } else {
          namaInput.value = '❌ ' + (cached.message || 'Kode toko tidak terdaftar');
          namaInput.className = 'error';
        }
        return;
      }

      // Throttle: pastikan jeda antar request minimal 1.5 detik
      const now = Date.now();
      const timeSinceLast = now - lastRequestTime;
      if (timeSinceLast < MIN_REQUEST_INTERVAL && lastRequestTime > 0) {
        const waitTime = MIN_REQUEST_INTERVAL - timeSinceLast;
        loadingText.textContent = 'Menunggu jeda...';
        loadingSub.textContent = `Tunggu ${(waitTime/1000).toFixed(1)} detik`;
        overlay.classList.add('active');
        await new Promise(resolve => setTimeout(resolve, waitTime));
        overlay.classList.remove('active');
      }

      isFetching = true;
      lastRequestTime = Date.now();

      // Tampilkan overlay
      overlay.classList.add('active');
      loadingText.textContent = 'Mencari toko...';
      loadingSub.textContent = 'Harap tunggu sebentar';

      namaInput.value = '🔍 Mencari...';
      namaInput.className = 'loading';
      resultDiv.style.display = 'none';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT);

        const url = `${API_URL}?action=getNamaToko&kode=${encodeURIComponent(kodeUpper)}`;
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();

        // Simpan di cache
        cache.set(kodeUpper, result);

        if (result.success) {
          namaInput.value = result.namaToko;
          namaInput.className = 'success';
        } else {
          namaInput.value = '❌ ' + (result.message || 'Kode toko tidak terdaftar');
          namaInput.className = 'error';
        }
      } catch (error) {
        console.error('fetchNamaToko error:', error);

        let errorMsg = '';
        if (error.name === 'AbortError') {
          errorMsg = '⏱️ Koneksi timeout, coba lagi';
          // Retry dengan backoff
          if (retryCount < 2) {
            loadingSub.textContent = `Mencoba ulang (${retryCount+1}/2)...`;
            await new Promise(resolve => setTimeout(resolve, 2000 * (retryCount + 1)));
            await fetchNamaToko(kode, retryCount + 1);
            return;
          }
        } else if (error.message === 'Failed to fetch' || error.message.includes('NetworkError')) {
          errorMsg = '⚠️ Gagal terhubung ke server';
          // Jika retry < 2, coba lagi
          if (retryCount < 2) {
            loadingSub.textContent = `Mencoba ulang (${retryCount+1}/2)...`;
            await new Promise(resolve => setTimeout(resolve, 2000 * (retryCount + 1)));
            await fetchNamaToko(kode, retryCount + 1);
            return;
          }
        } else {
          errorMsg = '⚠️ Error: ' + error.message;
        }

        // Simpan error di cache agar tidak request ulang
        cache.set(kodeUpper, { success: false, message: errorMsg });
        namaInput.value = errorMsg;
        namaInput.className = 'error';
      } finally {
        isFetching = false;
        overlay.classList.remove('active');
      }
    }

    // ===== SUBMIT REQUEST OTP =====
    async function submitRequest() {
      if (isFetching || isSubmitting) return;

      const email = emailInput.value.trim();
      const kode = kodeInputFinal.value.trim();
      const role = roleSelect.value;
      const nama = namaInput.value;

      if (!email) {
        showResult('Masukkan email terdaftar', 'error');
        return;
      }
      if (!kode) {
        showResult('Masukkan kode toko', 'error');
        return;
      }
      if (nama === '' || nama.includes('tidak ditemukan') || nama.includes('Gagal') || nama.includes('Error') || nama.includes('timeout')) {
        showResult('Kode toko tidak valid, periksa kembali', 'error');
        return;
      }

      resultDiv.style.display = 'none';
      isSubmitting = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      try {
        const formData = new URLSearchParams();
        formData.append('action', 'requestOtp');
        formData.append('email', email);
        formData.append('kode', kode);
        formData.append('role', role);

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();

        if (result.success) {
          showResult(result.message, 'success');
          // Reset field
          kodeInputFinal.value = '';
          namaInput.value = '';
          namaInput.className = '';
          roleSelect.value = 'user';
          toggleApprovalNote();
        } else {
          showResult(result.message, 'error');
        }
      } catch (error) {
        console.error('submitRequest error:', error);
        showResult('Gagal mengirim permintaan: ' + error.message, 'error');
      } finally {
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Request OTP';
      }
    }

    function showResult(message, type) {
      resultDiv.textContent = message;
      resultDiv.className = type;
      resultDiv.style.display = 'block';
    }

    // ===== TOGGLE APPROVAL NOTE =====
    function toggleApprovalNote() {
      approvalNote.classList.toggle('show', roleSelect.value === 'admin');
    }
    roleSelect.addEventListener('change', toggleApprovalNote);
    toggleApprovalNote();

    // ===== INPUT KODE (hanya uppercase) =====
    kodeInputFinal.addEventListener('input', function() {
      this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (this.value === '') {
        namaInput.value = '';
        namaInput.className = '';
      }
    });

    // ===== ENTER DI EMAIL UNTUK SUBMIT =====
    emailInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitRequest();
      }
    });

    console.log('✅ Aplikasi siap dengan cache dan throttle.');
  </script>
</body>
</html>
