<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP CCTV</title>
  <link rel="manifest" href="/otp_cctv/manifest.json">
  <style>
    /* style sama seperti di formOtp Anda */
  </style>
</head>
<body>
  <div class="container">
    <h2>Request OTP CCTV</h2>
    <!-- form sama seperti sebelumnya -->
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="email@domain.com">
    </div>
    <div class="form-group">
      <label for="kodeToko">Kode Toko:</label>
      <input type="text" id="kodeToko" placeholder="Masukkan kode toko">
    </div>
    <div class="form-group">
      <label for="namaToko">Nama Toko:</label>
      <input type="text" id="namaToko" readonly>
    </div>
    <div class="form-group">
      <label for="role">Role:</label>
      <select id="role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <button onclick="submitRequest()">Request OTP</button>
    <div id="result"></div>
  </div>

  <script>
    // GANTI dengan URL Web App Apps Script Anda (YANG SUDAH DIPUBLIKASIKAN)
    const API_URL = 'https://script.google.com/macros/s/AKfycbxVOWR6fi2s-CdSVRmPJnnFOQn3q-_fTfYj8yEVhggjOTrZZUt-s1cxjcJpz_ttO7w/exec';

    async function fetchNamaToko() {
      const kodeToko = document.getElementById('kodeToko').value;
      if (!kodeToko) return;
      
      try {
        const response = await fetch(`${API_URL}?action=getNamaToko&kode=${kodeToko}`);
        const result = await response.json();
        document.getElementById('namaToko').value = result.success ? result.namaToko : 'Toko tidak ditemukan';
      } catch (error) {
        document.getElementById('namaToko').value = 'Error: ' + error.message;
      }
    }

    async function submitRequest() {
      const email = document.getElementById('email').value;
      const kodeToko = document.getElementById('kodeToko').value;
      const role = document.getElementById('role').value;
      
      if (!email || !kodeToko) {
        showResult('Harap isi semua field', 'error');
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            action: 'requestOtp',
            email: email,
            kode: kodeToko,
            role: role
          })
        });
        const result = await response.json();
        showResult(result.message, result.success ? 'success' : 'error');
        if (result.success) {
          document.getElementById('kodeToko').value = '';
          document.getElementById('namaToko').value = '';
        }
      } catch (error) {
        showResult('Error: ' + error.message, 'error');
      }
    }

    function showResult(message, type) {
      const div = document.getElementById('result');
      div.textContent = message;
      div.className = type;
      div.style.display = 'block';
    }

    // Event listener untuk auto-fetch nama toko
    document.getElementById('kodeToko').addEventListener('blur', fetchNamaToko);
  </script>
</body>
</html>
