<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Untuk Chrome Android (splash screen) -->
  <meta name="theme-color" content="#0b2a4a">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">  
  <title>OTP CCTV - Request</title>
  <link rel="manifest" href="/otp_cctv/manifest.json">
  <style>
    /* ===== DESAIN PROFESIONAL (SAMA) ===== */
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #f0f4f8 0%, #d9e2ec 100%);
      padding: 20px;
    }

    .card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0, 20, 40, 0.15), 0 8px 24px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #0b2a4a 0%, #1a4b6d 100%);
      padding: 28px 32px 20px;
      text-align: center;
      border-bottom: 4px solid #4fc3f7;
    }

    .card-header h1 {
      color: #fff;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .card-header .subtitle {
      color: #b0d4f0;
      font-size: 13px;
      font-weight: 400;
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .card-body {
      padding: 32px 28px 28px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1e3b5a;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #dce4ec;
      border-radius: 14px;
      font-size: 16px;
      background-color: #f9fbfd;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      color: #1a2b3c;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #1a6b9e;
      box-shadow: 0 0 0 4px rgba(26, 107, 158, 0.12);
      background-color: #ffffff;
    }

    .form-group input[readonly] {
      background-color: #f0f4f8;
      color: #2c3e50;
      cursor: default;
    }

    .form-group input[readonly].loading {
      background-color: #eef3f7;
      color: #6b7f94;
      font-style: italic;
    }

    .form-group input[readonly].error {
      background-color: #fde8e8;
      color: #b33c3c;
      border-color: #f5c6cb;
    }

    .form-group input[readonly].success {
      background-color: #e3f0e8;
      color: #1d6b3e;
      border-color: #b8d9c4;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #1a5a8a 0%, #0e3b5e 100%);
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(10, 55, 94, 0.25);
      letter-spacing: 0.5px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(10, 55, 94, 0.35);
    }

    .btn-primary:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    #result {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      display: none;
      word-break: break-word;
    }

    #result.success {
      display: block;
      background: #e3f0e8;
      color: #1a5c3a;
      border: 1px solid #b8d9c4;
    }

    #result.error {
      display: block;
      background: #fde8e8;
      color: #a13131;
      border: 1px solid #f5c6cb;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .overlay.active {
      display: flex;
    }

    .overlay-box {
      background: white;
      padding: 32px 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.3);
      max-width: 320px;
      width: 90%;
    }

    .overlay-box .spinner {
      border: 4px solid #e6edf4;
      border-top: 4px solid #1a6b9e;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .overlay-box p {
      color: #1a2b3c;
      font-size: 16px;
      font-weight: 500;
      margin: 0;
    }

    .overlay-box .sub {
      color: #5f7a94;
      font-size: 14px;
      font-weight: 400;
      margin-top: 4px;
    }

    .approval-note {
      background: #fef9e6;
      border-left: 4px solid #f5b342;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      color: #7a6200;
      margin: -8px 0 18px 0;
      display: none;
    }

    .approval-note.show {
      display: block;
    }

    .hint {
      font-size: 12px;
      color: #7a8fa0;
      margin-top: 4px;
      font-weight: 400;
    }

    @media (max-width: 600px) {
      .card-header {
        padding: 20px 20px 16px;
      }
      .card-header h1 {
        font-size: 20px;
      }
      .card-body {
        padding: 24px 18px 22px;
      }
      .form-group input,
      .form-group select {
        padding: 12px 14px;
        font-size: 15px;
      }
      .btn-primary {
        padding: 14px;
        font-size: 16px;
      }
    }

    /* ===== SPLASH SCREEN ===== */
#splash {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: linear-gradient(145deg, #0b2a4a, #1a4b6d);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}

#splash.hidden {
  opacity: 0;
  visibility: hidden;
}

.splash-logo {
  width: 100px;
  height: 100px;
  background: rgba(255,255,255,0.1);
  border-radius: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  color: white;
  box-shadow: 0 12px 40px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
  animation: pulse 1.8s ease-in-out infinite;
}

@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  50% { transform: scale(1.05); box-shadow: 0 16px 56px rgba(79, 195, 247, 0.25); }
  100% { transform: scale(1); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
}

.splash-title {
  margin-top: 24px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: linear-gradient(135deg, #ffffff 0%, #b0d4f0 50%, #4fc3f7 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.splash-sub {
  margin-top: 6px;
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 300;
}

.splash-loader {
  margin-top: 32px;
  display: flex;
  gap: 8px;
}

.splash-loader span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  animation: bounce 1.4s ease-in-out infinite;
}

.splash-loader span:nth-child(1) { animation-delay: 0s; }
.splash-loader span:nth-child(2) { animation-delay: 0.2s; }
.splash-loader span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.2; }
  40% { transform: scale(1); opacity: 1; background: rgba(79, 195, 247, 0.8); }
}

#splash::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 40%, rgba(79,195,247,0.03) 0%, transparent 60%);
  animation: shimmer 6s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes shimmer {
  0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
  100% { transform: translate(20%, 10%) scale(1.2); opacity: 0.8; }
}

@media (max-width: 600px) {
  .splash-logo {
    width: 72px;
    height: 72px;
    font-size: 32px;
    border-radius: 20px;
  }
  .splash-title {
    font-size: 22px;
  }
  .splash-sub {
    font-size: 11px;
    letter-spacing: 2px;
  }
  .splash-loader span {
    width: 8px;
    height: 8px;
  }
}
    
  </style>
</head>
<body>
   <!-- SPLASH SCREEN -->
  <div id="splash">
    <div class="splash-logo">🔐</div>
    <div class="splash-title">OTP CCTV</div>
    <div class="splash-sub">Secure Access</div>
    <div class="splash-loader">
      <span></span><span></span><span></span>
    </div>
  </div>
  
  <!-- OVERLAY LOADING -->
  <div class="overlay" id="loadingOverlay">
    <div class="overlay-box">
      <div class="spinner"></div>
      <p id="loadingText">Mencari toko...</p>
      <div class="sub" id="loadingSub">Harap tunggu sebentar</div>
    </div>
  </div>

  <!-- CARD -->
  <div class="card">
    <div class="card-header">
      <h1>🔐 Request OTP CCTV</h1>
      <div class="subtitle">Alfamart Rembang Access Management</div>
    </div>

    <div class="card-body">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="email@perusahaan.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="kodeToko">Kode Toko</label>
        <input 
          type="text" 
          id="kodeToko" 
          placeholder="Contoh: 2A01"
          autocomplete="off"
          maxlength="4"
          enterkeyhint="search"
        >
        <div class="hint">Tekan <kbd>Enter</kbd> untuk mencari nama toko</div>
      </div>

      <div class="form-group">
        <label for="namaToko">Nama Toko</label>
        <input type="text" id="namaToko" readonly placeholder=" ">
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select id="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div id="approvalNote" class="approval-note">
        <span class="note-icon">⏳</span> Permintaan dengan role <strong>Admin</strong> memerlukan persetujuan atasan. OTP akan dikirim setelah disetujui.
      </div>

      <button class="btn-primary" id="submitBtn" onclick="submitRequest()">Request OTP</button>

      <div id="result"></div>
    </div>
  </div>

 <script>
  // ===== KONFIGURASI =====
  const API_URL = 'https://script.google.com/macros/s/AKfycbxVOWR6fi2s-CdSVRmPJnnFOQn3q-_fTfYj8yEVhggjOTrZZUt-s1cxjcJpz_ttO7w/exec';
  const FETCH_TIMEOUT = 8000;
  const MIN_REQUEST_INTERVAL = 1500;
  const EMAIL_STORAGE_KEY = 'otp_cctv_emails';

  // ===== SPLASH SCREEN (Eksekusi Cepat) =====
(function() {
  var splash = document.getElementById('splash');
  if (!splash) return;

  // Cek apakah splash sudah ditampilkan di sesi ini
  if (sessionStorage.getItem('splashShown')) {
    splash.style.display = 'none';
    return;
  }

  // Tandai bahwa splash sudah ditampilkan
  sessionStorage.setItem('splashShown', 'true');

  // Tampilkan splash (sudah tampil secara default, tapi pastikan)
  splash.style.display = 'flex';

  // Sembunyikan setelah 1.5 detik (lebih cepat dari 2 detik)
  setTimeout(function() {
    splash.classList.add('hidden');
  }, 2000); // 1.5 detik
})();

  // ===== CACHE =====
  const cache = new Map();

  // ===== ELEMEN =====
  const kodeInput = document.getElementById('kodeToko');
  const namaInput = document.getElementById('namaToko');
  const emailInput = document.getElementById('email');
  const roleSelect = document.getElementById('role');
  const resultDiv = document.getElementById('result');
  const submitBtn = document.getElementById('submitBtn');
  const overlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const loadingSub = document.getElementById('loadingSub');
  const approvalNote = document.getElementById('approvalNote');

  let isFetching = false;
  let isSubmitting = false;
  let lastRequestTime = 0;

  // ===== EMAIL HISTORY =====
  function getEmailHistory() {
    try {
      const data = localStorage.getItem(EMAIL_STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch { return []; }
  }

  function saveEmailHistory(emails) {
    localStorage.setItem(EMAIL_STORAGE_KEY, JSON.stringify(emails));
  }

  function addEmailToHistory(email) {
    if (!email) return;
    let emails = getEmailHistory();
    emails = emails.filter(e => e.toLowerCase() !== email.toLowerCase());
    emails.unshift(email);
    if (emails.length > 3) emails = emails.slice(0, 3);
    saveEmailHistory(emails);
    updateEmailDatalist();
  }

  function updateEmailDatalist() {
    const emails = getEmailHistory();
    const datalist = document.getElementById('emailHistory');
    if (datalist) {
      datalist.innerHTML = emails.map(e => `<option value="${e}">`).join('');
    }
  }
  updateEmailDatalist();

  // ===== HAPUS EVENT LISTENER LAMA (clone) =====
  const newKodeInput = kodeInput.cloneNode(true);
  kodeInput.parentNode.replaceChild(newKodeInput, kodeInput);
  const kodeInputFinal = newKodeInput;

  // ===== EVENT HANYA ENTER =====
  kodeInputFinal.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const kode = this.value.trim();
      if (!kode) {
        namaInput.value = '';
        namaInput.className = '';
        return;
      }
      if (!isFetching) {
        fetchNamaToko(kode);
        this.blur(); // Sembunyikan keyboard di mobile
      }
    }
  });

  // ===== FETCH DENGAN CACHE & THROTTLE =====
  async function fetchNamaToko(kode, retryCount = 0) {
    // (Kode fetch sama dengan versi sebelumnya, tidak perlu diubah)
    // Pastikan Anda sudah memiliki fungsi ini dari implementasi sebelumnya.
    // Saya sertakan versi ringkasnya di bawah sebagai placeholder.
    // Silakan gunakan kode fetch yang sudah Anda miliki.
    if (isFetching) return;
    const kodeUpper = kode.toUpperCase().trim();

    if (cache.has(kodeUpper)) {
      const cached = cache.get(kodeUpper);
      if (cached.success) {
        namaInput.value = cached.namaToko;
        namaInput.className = 'success';
      } else {
        namaInput.value = '❌ ' + (cached.message || 'Kode toko tidak terdaftar');
        namaInput.className = 'error';
      }
      return;
    }

    const now = Date.now();
    const timeSinceLast = now - lastRequestTime;
    if (timeSinceLast < MIN_REQUEST_INTERVAL && lastRequestTime > 0) {
      const waitTime = MIN_REQUEST_INTERVAL - timeSinceLast;
      loadingText.textContent = 'Menunggu jeda...';
      loadingSub.textContent = `Tunggu ${(waitTime/1000).toFixed(1)} detik`;
      overlay.classList.add('active');
      await new Promise(resolve => setTimeout(resolve, waitTime));
      overlay.classList.remove('active');
    }

    isFetching = true;
    lastRequestTime = Date.now();
    overlay.classList.add('active');
    loadingText.textContent = 'Mencari toko...';
    loadingSub.textContent = 'Harap tunggu sebentar';
    namaInput.value = '🔍 Mencari...';
    namaInput.className = 'loading';
    resultDiv.style.display = 'none';

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT);
      const url = `${API_URL}?action=getNamaToko&kode=${encodeURIComponent(kodeUpper)}`;
      const response = await fetch(url, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      cache.set(kodeUpper, result);
      if (result.success) {
        namaInput.value = result.namaToko;
        namaInput.className = 'success';
      } else {
        namaInput.value = '❌ ' + (result.message || 'Kode toko tidak terdaftar');
        namaInput.className = 'error';
      }
    } catch (error) {
      console.error('fetchNamaToko error:', error);
      let errorMsg = '';
      if (error.name === 'AbortError') {
        errorMsg = '⏱️ Koneksi timeout, coba lagi';
        if (retryCount < 2) {
          loadingSub.textContent = `Mencoba ulang (${retryCount+1}/2)...`;
          await new Promise(resolve => setTimeout(resolve, 2000 * (retryCount + 1)));
          await fetchNamaToko(kode, retryCount + 1);
          return;
        }
      } else if (error.message === 'Failed to fetch' || error.message.includes('NetworkError')) {
        errorMsg = '⚠️ Gagal terhubung ke server';
        if (retryCount < 2) {
          loadingSub.textContent = `Mencoba ulang (${retryCount+1}/2)...`;
          await new Promise(resolve => setTimeout(resolve, 2000 * (retryCount + 1)));
          await fetchNamaToko(kode, retryCount + 1);
          return;
        }
      } else {
        errorMsg = '⚠️ Error: ' + error.message;
      }
      cache.set(kodeUpper, { success: false, message: errorMsg });
      namaInput.value = errorMsg;
      namaInput.className = 'error';
    } finally {
      isFetching = false;
      overlay.classList.remove('active');
    }
  }

   // ===== AMBIL FOTO & LOKASI (Hanya dari Kamera) =====
  function takePhotoAndLocation() {
  return new Promise((resolve, reject) => {
    // 1. Minta lokasi GPS
    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        // 2. Buka kamera (paksa kamera belakang/lingkungan)
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment'; // 'user' untuk selfie, 'environment' untuk lingkungan
        input.style.display = 'none';

        input.onchange = function(e) {
          const file = e.target.files[0];
          if (!file) {
            reject('Tidak ada foto yang diambil');
            return;
          }

          // Baca file sebagai base64
          const reader = new FileReader();
          reader.onload = function(ev) {
            // Resize gambar (maks 800x600) untuk menghemat ukuran
            const img = new Image();
            img.onload = function() {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800;
              const MAX_HEIGHT = 600;
              let width = img.width;
              let height = img.height;
              if (width > height) {
                if (width > MAX_WIDTH) {
                  height *= MAX_WIDTH / width;
                  width = MAX_WIDTH;
                }
              } else {
                if (height > MAX_HEIGHT) {
                  width *= MAX_HEIGHT / height;
                  height = MAX_HEIGHT;
                }
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
              const base64 = dataUrl.split(',')[1];
              resolve({ fotoBase64: base64, lat, lng });
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        };

        // Tambahkan input ke body, trigger klik, lalu hapus
        document.body.appendChild(input);
        input.click();
        input.remove();
      },
      err => {
        reject('Gagal mendapatkan lokasi: ' + err.message);
      }
    );
  });
}

  // ===== SUBMIT REQUEST OTP =====
  async function submitRequest() {
  if (isFetching || isSubmitting) return;

  const email = emailInput.value.trim();
  const kode = kodeInputFinal.value.trim();
  const role = roleSelect.value;
  const nama = namaInput.value;

  // Validasi awal
  if (!email) {
    showResult('Masukkan email terdaftar', 'error');
    return;
  }
  if (!kode) {
    showResult('Masukkan kode toko', 'error');
    return;
  }
  if (nama === '' || nama.includes('tidak ditemukan') || nama.includes('Gagal') || nama.includes('Error') || nama.includes('timeout')) {
    showResult('Kode toko tidak valid, periksa kembali', 'error');
    return;
  }

  // Sembunyikan hasil sebelumnya
  resultDiv.style.display = 'none';
  isSubmitting = true;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Mengakses kamera & GPS...';

  try {
    // Ambil foto dan lokasi (otomatis muncul izin)
    const { fotoBase64, lat, lng } = await takePhotoAndLocation();

    // Update tombol
    submitBtn.textContent = 'Memproses...';

    // Siapkan data untuk dikirim
    const formData = new URLSearchParams();
    formData.append('action', 'requestOtp');
    formData.append('email', email);
    formData.append('kode', kode);
    formData.append('role', role);
    formData.append('foto', fotoBase64);
    formData.append('lat', lat);
    formData.append('lng', lng);

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const result = await response.json();

    if (result.success) {
      showResult(result.message, 'success');
      addEmailToHistory(email);
      // Reset form
      kodeInputFinal.value = '';
      namaInput.value = '';
      namaInput.className = '';
      roleSelect.value = 'user';
      toggleApprovalNote();
      document.activeElement?.blur();
    } else {
      showResult(result.message, 'error');
    }
  } catch (error) {
    console.error('submitRequest error:', error);
    showResult('Error: ' + error.message, 'error');
  } finally {
    isSubmitting = false;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Request OTP';
  }
}

  function showResult(message, type) {
    resultDiv.textContent = message;
    resultDiv.className = type;
    resultDiv.style.display = 'block';
  }

  // ===== TOGGLE APPROVAL NOTE =====
  function toggleApprovalNote() {
    approvalNote.classList.toggle('show', roleSelect.value === 'admin');
  }
  roleSelect.addEventListener('change', toggleApprovalNote);
  toggleApprovalNote();

  // ===== INPUT KODE (hanya uppercase) =====
  kodeInputFinal.addEventListener('input', function() {
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (this.value === '') {
      namaInput.value = '';
      namaInput.className = '';
    }
  });

  // ===== ENTER DI EMAIL UNTUK SUBMIT =====
  emailInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitRequest();
      this.blur();
    }
  });

  // ===== KLIK DI LUAR INPUT UNTUK SEMBUNYIKAN KEYBOARD =====
  document.addEventListener('click', function(e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'BUTTON') {
      document.activeElement?.blur();
    }
  });

  console.log('✅ Aplikasi siap dengan cache, throttle, dan email history.');
</script>
</body>
</html>
